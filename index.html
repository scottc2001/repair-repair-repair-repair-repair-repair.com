<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
</head>
<body>


 <h5>A-sound-mind-traces-the-infernal-rhythms-of-the-machine.com</h5>

  <img src="hero.JPG" alt="Front image"  style="width:80%;">
  
  <details>
    <summary><h2>INFO</h2></summary>
   <div class="header-container">
    <p style="margin-left: 10px; margin-top: 20px; margin-bottom: 20px">
  this is my ongoing repair gallery, 2023-present<br><br>

</div>

  <details>
    <summary><h2>IMAGES</h2></summary>
    <!-- Ensure the ID matches what gallery.js expects -->
    <div class="image-list" id="repairs-gallery"></div>
  </details>

  <div id="repairs-lightbox" class="lightbox" style="display:none;">
    <span class="close-btn">&times;</span>
    <img class="lightbox-img" src="" style="display:block;">
    <video class="lightbox-video" src="" controls style="display:none;"></video>
    <span class="nav-prev">&#10094;</span>
    <span class="nav-next">&#10095;</span>
    <span class="lightbox-caption"></span>
  </div>



  <!-- Keep gallery.js the same -->
  <script src="gallery.js"></script>

  <script>
    // Navigation arrows
    document.querySelectorAll('.nav-arrow').forEach(arrow => {
      arrow.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        target.querySelector('.lightbox-img').scrollIntoView({behavior: 'smooth'});
      });
    });
  </script>

  <script>
    // Accordion functionality
    var acc = document.getElementsByClassName("accordion");
    for (var i = 0; i < acc.length; i++) {
      acc[i].addEventListener("click", function(event) {
        event.preventDefault();
        this.classList.toggle("active");
        var panel = this.nextElementSibling;
        if (panel.style.display === "block") {
          panel.style.display = "none";
        } else {
          panel.style.display = "block";
        }
      });
    }

    // Image toggle
    var imageLinks = document.getElementsByClassName("image-link");
    for (var j = 0; j < imageLinks.length; j++) {
      imageLinks[j].addEventListener("click", function(event) {
        var imageId = this.getAttribute("data-image");
        var imageElement = document.getElementById(imageId);
        if (imageElement.style.display === "block") {
          imageElement.style.display = "none";
        } else {
          imageElement.style.display = "block";
        }
      });
    }
  </script>

  <script>
    // Keyboard navigation for lightbox
    document.addEventListener('keydown', function(e) {
      const openLightbox = document.querySelector('.lightbox:target');
      if (!openLightbox) return;

      const currentId = openLightbox.id;
      const lightboxes = ['lightbox1', 'lightbox2', 'lightbox3'];
      const index = lightboxes.indexOf(currentId);

      if (e.key === 'ArrowRight') {
        const next = lightboxes[index + 1];
        if (next) window.location.hash = '#' + next;
      }
      if (e.key === 'ArrowLeft') {
        const prev = lightboxes[index - 1];
        if (prev) window.location.hash = '#' + prev;
      }
      if (e.key === 'Escape') {
        window.location.hash = '';
      }
    });
  </script>

</body>
</html>
